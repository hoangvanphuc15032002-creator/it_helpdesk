version: '3.8'

services:
  # HỆ THỐNG IT HELPDESK UNIFIED SERVICE (WEB DASHBOARD + TELEGRAM BOT + WATCHDOG)
  it-helpdesk:
    build: .
    container_name: it_helpdesk_system
    command: python main.py
    ports:
      - "8080:8080"
    volumes:
      - .:/app
    restart: always
    environment:
      - PYTHONUNBUFFERED=1