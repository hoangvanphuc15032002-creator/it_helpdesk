<!-- Modal Sửa Ticket -->
<div id="editTicketModal" class="hidden fixed inset-0 bg-slate-900/60 z-50 flex items-center justify-center backdrop-blur-sm transition-all duration-300">
    <div class="bg-white p-8 rounded-3xl w-[500px] shadow-2xl relative transform transition-all scale-95 opacity-0" id="modalContent">
        <h3 class="text-xl font-black mb-6 uppercase text-slate-800 border-b pb-3">Sửa Ticket #<span id="editTid" class="text-indigo-600"></span></h3>
        <div class="space-y-4">
            <div>
                <label class="text-[10px] font-bold text-slate-400 uppercase">Nội dung sự cố</label>
                <textarea id="editIssue" class="w-full border border-slate-200 p-3 rounded-xl text-sm h-24 focus:ring-2 focus:ring-indigo-500 outline-none"></textarea>
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="text-[10px] font-bold text-slate-400 uppercase">Trạng thái</label>
                    <select id="editStatus" class="w-full border border-slate-200 p-3 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                        <option value="Mới">Mới</option><option value="Đang xử lý">Đang xử lý</option><option value="Hoàn thành">Hoàn thành</option>
                    </select>
                </div>
                <div>
                    <label class="text-[10px] font-bold text-slate-400 uppercase">IT Phụ trách chính</label>
                    <select id="editMainIt" class="w-full border border-slate-200 p-3 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none"></select>
                </div>
            </div>
            <div>
                <label class="text-[10px] font-bold text-slate-400 uppercase">Tên IT Hỗ trợ (Ngăn cách bằng dấu phẩy)</label>
                <input type="text" id="editSupNames" class="w-full border border-slate-200 p-3 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest block mb-1">📅 Ngày & Giờ Tạo</label>
                    <input type="datetime-local" id="editCreatedAt" class="w-full border border-slate-200 p-2.5 rounded-xl text-xs font-bold focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <div>
                    <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest block mb-1">⏰ Ngày & Giờ Hoàn Thành</label>
                    <input type="datetime-local" id="editCompletedAt" class="w-full border border-slate-200 p-2.5 rounded-xl text-xs font-bold focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
            </div>
        </div>
        <div class="mt-8 flex justify-end gap-3">
            <button onclick="closeModal()" class="px-6 py-2.5 bg-slate-100 text-slate-600 font-bold rounded-xl hover:bg-slate-200 transition">Hủy</button>
            <button onclick="submitEditTicket()" class="px-6 py-2.5 bg-indigo-600 text-white font-bold rounded-xl shadow-lg shadow-indigo-500/30 hover:bg-indigo-700 transition">Lưu thay đổi</button>
        </div>
    </div>
</div>

<!-- Modal Thêm Ticket Thủ Công -->
<div id="addTicketModal" class="hidden fixed inset-0 bg-slate-900/60 z-50 flex items-center justify-center backdrop-blur-sm transition-all duration-300">
    <div class="bg-white p-8 rounded-3xl w-[550px] shadow-2xl relative transform transition-all scale-95 opacity-0" id="addTicketModalContent">
        <h3 class="text-xl font-black mb-6 uppercase text-slate-800 border-b pb-3 flex items-center justify-between">
            <span class="flex items-center"><i class="fa-solid fa-square-plus text-indigo-600 mr-2"></i>Thêm Ticket Thủ Công</span>
            <span class="text-xs font-normal text-slate-400 normal-case">(Xử lý trực tiếp / Không qua Bot)</span>
        </h3>
        <div class="space-y-4">
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest block mb-1">Tên Người Yêu Cầu (Khách) *</label>
                    <input type="text" id="addTicketUserName" placeholder="Ví dụ: Nguyễn Văn A" class="w-full border border-slate-200 p-3 rounded-xl text-sm font-bold focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <div>
                    <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest block mb-1">Phòng Ban *</label>
                    <input type="text" id="addTicketDept" list="deptsList" placeholder="Ví dụ: Kế toán" class="w-full border border-slate-200 p-3 rounded-xl text-sm font-bold focus:ring-2 focus:ring-indigo-500 outline-none">
                    <datalist id="deptsList"></datalist>
                </div>
            </div>
            <div>
                <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest block mb-1">Mô tả sự cố / Công việc xử lý *</label>
                <textarea id="addTicketIssue" rows="3" placeholder="Nhập chi tiết lỗi hoặc nội dung đã hỗ trợ..." class="w-full border border-slate-200 p-3 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none"></textarea>
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest block mb-1">IT Phụ trách chính</label>
                    <select id="addTicketItId" class="w-full border border-slate-200 p-3 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none"></select>
                </div>
                <div>
                    <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest block mb-1">Trạng thái Ticket</label>
                    <select id="addTicketStatus" class="w-full border border-slate-200 p-3 rounded-xl text-sm font-bold focus:ring-2 focus:ring-indigo-500 outline-none">
                        <option value="Hoàn thành" selected>✅ Hoàn thành (Đã xong)</option>
                        <option value="Đang xử lý">⏳ Đang xử lý</option>
                        <option value="Mới">🚨 Mới (Chờ nhận)</option>
                    </select>
                </div>
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest block mb-1">📅 Ngày & Giờ Tạo Ticket *</label>
                    <input type="datetime-local" id="addTicketCreatedAt" class="w-full border border-slate-200 p-2.5 rounded-xl text-xs font-bold focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <div>
                    <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest block mb-1">⏰ Ngày & Giờ Hoàn Thành</label>
                    <input type="datetime-local" id="addTicketCompletedAt" class="w-full border border-slate-200 p-2.5 rounded-xl text-xs font-bold focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
            </div>
            <div>
                <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest block mb-1">Đánh giá KPI (Số sao)</label>
                <select id="addTicketRating" class="w-full border border-slate-200 p-3 rounded-xl text-sm font-bold focus:ring-2 focus:ring-indigo-500 outline-none">
                    <option value="5" selected>5 ⭐ - Xuất sắc</option>
                    <option value="4">4 ⭐ - Tốt</option>
                    <option value="3">3 ⭐ - Khá</option>
                    <option value="2">2 ⭐ - Trung bình</option>
                    <option value="1">1 ⭐ - Cần cải thiện</option>
                </select>
            </div>
        </div>
        <div class="mt-8 flex justify-end gap-3">
            <button onclick="closeAddTicketModal()" class="px-6 py-2.5 bg-slate-100 text-slate-600 font-bold rounded-xl hover:bg-slate-200 transition">Hủy</button>
            <button onclick="submitAddTicket()" class="px-6 py-2.5 bg-indigo-600 text-white font-bold rounded-xl shadow-lg shadow-indigo-500/30 hover:bg-indigo-700 transition flex items-center">
                <i class="fa-solid fa-plus-circle mr-2"></i> Lưu Ticket
            </button>
        </div>
    </div>
</div>
