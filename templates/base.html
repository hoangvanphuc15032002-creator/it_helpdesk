<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}IT Helpdesk Command Center{% endblock %}</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'><stop offset='0%25' stop-color='%2310b981'/><stop offset='100%25' stop-color='%23059669'/></linearGradient></defs><rect width='100' height='100' rx='28' fill='url(%23g)'/><path d='M30 46 C30 30 70 30 70 46 L70 58 A10 10 0 0 1 60 68 L50 68 C44 68 40 64 40 58' stroke='white' stroke-width='7' fill='none' stroke-linecap='round'/><rect x='22' y='42' width='14' height='22' rx='6' fill='white'/><rect x='64' y='42' width='14' height='22' rx='6' fill='white'/><circle cx='40' cy='58' r='4' fill='%23a3e635'/></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .sidebar-item.active { background: rgba(16, 185, 129, 0.12); border-left: 4px solid #10b981; color: #10b981; }
        .modern-card { background: white; border: 1px solid #e2e8f0; border-radius: 1.25rem; transition: all 0.3s; }
        .status-badge { padding: 4px 10px; border-radius: 9999px; font-size: 11px; font-weight: 700; text-transform: uppercase; }
        .status-Mới { background: #fef2f2; color: #ef4444; border: 1px solid #fee2e2; }
        .status-Đang { background: #fffbeb; color: #f59e0b; border: 1px solid #fef3c7; }
        .status-Hoàn { background: #f0fdf4; color: #22c55e; border: 1px solid #dcfce7; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .tab-content { animation: fadeIn 0.3s ease-out; }
        .star-filled { color: #f59e0b; }
        .star-empty { color: #e2e8f0; }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body class="flex h-screen overflow-hidden text-slate-700">
    {% block content %}{% endblock %}
    {% block extra_scripts %}{% endblock %}
</body>
</html>
